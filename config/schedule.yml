# Recurring jobs read by bin/scheduler. Each entry pushes a body of
#   { "class": "<class_name>", "args": [] }
# onto the named tube on the given schedule. The maintenance worker
# (bin/worker maintenance) drains splat.maintenance and dispatches by class name.
#
# Schedules accept rufus syntax: "every Xs/m/h/d" or cron strings.
#
# `con:` adds a tuber concurrency tag so the server caps simultaneous reserves
# for jobs sharing that key. Maintenance jobs use con:1 — only one heavy
# flush/retention/cleanup can run at a time across the pool, regardless of how
# many consumers are watching or how deep the maintenance tube has backed up.
#
# `idp:` adds a tuber idempotency key. While a job with that key is already in
# the tube (ready or reserved), further puts with the same key are suppressed.
# Use on cron jobs that occasionally run longer than their cron interval —
# stops the scheduler from stacking duplicates while one is mid-flight.

# Minute sweep of check-in monitors: opens an Issue when a monitor misses its
# expected check-in (interval + margin), reports an error, or overruns
# max_runtime. Rides splat.checkins (NOT splat.maintenance) so it can't queue
# behind long maintenance jobs — alert latency is the whole point. Cheap: one
# scan of the small monitors table; writes only on state transitions.
monitor_evaluation:
  class: Monitors::EvaluateJob
  tube: splat.checkins
  schedule: every 60s
  idp: monitor_evaluation

# Explicit TRUNCATE checkpoint of the write-heavy DBs. SQLite's automatic
# checkpoint is passive — it yields to readers and lets the WAL keep growing —
# and on the logs DB, where every insert also writes the logs_fts_* triggers'
# index entries, it loses the race and never recovers. Left alone it ran away to
# a 4.2 GB WAL on 2026-08-17 and took ingest down with it. See the job.
#
# Rides splat.checkins (NOT splat.maintenance) for the same reason
# monitor_evaluation does: this is the job that stops the WAL running away, so
# it must never queue behind RetentionJob or the deep storage pass — those are
# exactly the hours when the WAL is growing fastest. Cheap when there's nothing
# to do (the checkpoint is a no-op on a small WAL), and bounded by busy_timeout
# when there is.
wal_checkpoint:
  class: Maintenance::WalCheckpointJob
  tube: splat.checkins
  schedule: every 10m
  idp: wal_checkpoint

# Hourly rollup of the previous hour's transactions into per-bucket counts in
# transaction_histograms. Runs a few minutes past the hour so any in-flight
# inserts for that hour have landed. Idempotent — re-running overwrites.
histogram_rollup:
  class: Analytics::HistogramRollupJob
  tube: splat.maintenance
  schedule: cron 5 * * * *
  con: 1
  idp: histogram_rollup

# Daily delete-by-timestamp of aged events/transactions/spans, plus
# incremental_vacuum to actually return pages to disk. Histograms are
# retained much longer than raw rows.
data_retention:
  class: Maintenance::RetentionJob
  tube: splat.maintenance
  schedule: cron 0 2 * * *
  con: 1

# Nightly FTS5 segment merge on the logs search index, plus vacuum. Retention
# deletes only write delete-markers into logs_fts; without an explicit merge the
# index grows without bound. Runs after data_retention so the night's deletes
# are merged away immediately. Time-budgeted and stepped (see the job) — it is
# expected to leave work behind on a big index and pick it up the next night.
logs_fts_optimize:
  class: Maintenance::LogsFtsOptimizeJob
  tube: splat.maintenance
  schedule: cron 40 2 * * *
  con: 1
  idp: logs_fts_optimize

# Daily dictionary-drift check. Per-segment enumeration job that fans out
# Compression::DictTrainingJob — trains a candidate against recent samples,
# promotes if it beats the current dict by more than the gain threshold.
dictionary_drift:
  class: Compression::DictDriftJob
  tube: splat.maintenance
  schedule: cron 10 4 * * *
  con: 1
  idp: dictionary_drift

cleanup_expired_oidc_sessions:
  class: CleanupExpiredOidcSessionsJob
  tube: splat.maintenance
  schedule: cron 17 * * * *
  con: 1

# Refresh the SQLite storage snapshot for the settings page and cache it. Both
# passes are kept off the request path entirely — the settings controller only
# reads the cached snapshot.
#
# The cheap pass: file totals via PRAGMA, compression ratios from an anchored
# rowid sample, retention bounds from indexed MIN/MAX. Index seeks only, so it
# finishes in seconds regardless of DB size.
storage_stats:
  class: Maintenance::StorageStatsJob
  tube: splat.maintenance
  schedule: cron 7 * * * *
  con: 1
  idp: storage_stats

# The deep pass: per-table dbstat page walk + COUNT(*) per table, which is
# ~two full reads of every DB. This was once folded into the 15-minute job
# above, which meant the maintenance worker ran a full-dataset scan permanently
# and starved every other job on the tube.
#
# Weekly, not daily. The ~80 min in the original note was measured at 100 GB; at
# 277 GB the 2026-08-16 run took just under 8 hours (03:40 -> 11:34), i.e. it
# ran straight through the morning peak, holding read snapshots and saturating
# the disk the whole way. It populates a table-size display — that is not worth
# a full-dataset scan every day. Sunday, so the long tail lands on a quiet day.
# If it needs to be more frequent, make it cheaper first.
storage_stats_deep:
  class: Maintenance::StorageStatsJob
  args: ["deep"]
  tube: splat.maintenance
  schedule: cron 40 3 * * 0
  con: 1
  idp: storage_stats_deep
