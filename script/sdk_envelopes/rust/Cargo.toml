[package]
name = "checkout"
version = "1.0.0"
edition = "2021"
publish = false

[dependencies]
# The default features, except the reqwest + native-tls transport: ureq
# without TLS builds on rust:1-slim with no OpenSSL, and the DSN is plain http.
sentry = { version = "=0.49.3", default-features = false, features = ["backtrace", "contexts", "debug-images", "logs", "metrics", "panic", "release-health", "ureq"] }
serde_json = "1"
thiserror = "2"
