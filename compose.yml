# Production docker-compose for Splat (SQLite — the only flavour) — web +
# tuber + one worker (ingest and maintenance, each in a process of its own).
# Tuber fires the recurring jobs itself; a tuber older than 0.16 also needs the
# scheduler (see below).
#
# compose.yml is Compose's default filename, so -f is optional:
#
#   docker compose -p splat up -d
#
# Volumes are bind-mounted relative to this file (./storage). Point them at a
# backed-up host path for a real deploy. Required .env vars: HOST_IP,
# SECRET_KEY_BASE, SPLAT_HOST, SPLAT_INTERNAL_HOST, SPLAT_ADMIN_EMAILS,
# SPLAT_EMAIL_FROM, SMTP_*, MCP_AUTH_TOKEN, SENTRY_DSN,
# SENTRY_TRACES_SAMPLE_RATE, OIDC_*, SPLAT_ALLOWED_USERS.

x-common-variables: &common-variables
  RAILS_ENV: production
  SECRET_KEY_BASE: ${SECRET_KEY_BASE}
  SPLAT_HOST: ${SPLAT_HOST}
  SPLAT_INTERNAL_HOST: ${SPLAT_INTERNAL_HOST}
  SPLAT_ADMIN_EMAILS: ${SPLAT_ADMIN_EMAILS}
  SPLAT_EMAIL_FROM: ${SPLAT_EMAIL_FROM}

  SMTP_ADDRESS: ${SMTP_ADDRESS}
  SMTP_PORT: ${SMTP_PORT}
  SMTP_USER_NAME: ${SMTP_USER_NAME}
  SMTP_PASSWORD: ${SMTP_PASSWORD}

  MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN}
  SENTRY_DSN: ${SENTRY_DSN}
  SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE}

  # Default true: we sit behind a TLS-terminating proxy (Caddy). Set both to
  # "false" for a bare-HTTP deployment reached directly on :3030 with no proxy,
  # or every form POST 422s on the CSRF origin check (https base_url vs http
  # Origin). Empty/unset counts as true.
  SPLAT_ASSUME_SSL: ${SPLAT_ASSUME_SSL:-true}
  SPLAT_FORCE_SSL: ${SPLAT_FORCE_SSL:-true}

  # Send Rails logs to stdout so `docker compose logs <service>` shows
  # them. Without this, Rails writes to log/production.log and the bind-
  # mounted host dir needs UID 1000 perms — easy to get wrong on a fresh
  # deploy and silent when it's wrong.
  RAILS_LOG_TO_STDOUT: "true"

  # Container-to-container DNS uses the service name on the container port.
  # The host-side port mapping is irrelevant inside the network.
  TUBER_URL: tuber:11300

x-splat-worker: &splat-worker
  image: ghcr.io/dkam/splat:latest
  pull_policy: always   # :latest moves on each release; always re-pull on `up -d`
  restart: unless-stopped
  depends_on:
    - tuber
  volumes:
    - ./storage:/rails/storage
  environment:
    <<: *common-variables
  logging:
    driver: "json-file"
    options:
      max-size: "100m"
      max-file: "3"

services:
  web:
    image: ghcr.io/dkam/splat:latest
    pull_policy: always   # :latest moves on each release; always re-pull on `up -d`
    environment:
      <<: *common-variables
      # Puma threads (config/puma.rb also defaults to 5). Set explicitly here so
      # it takes effect on `up -d` without waiting for an image release: at the
      # old 3, three slow requests occupied every thread and took the whole
      # instance down — a single pathological query became a site outage.
      RAILS_MAX_THREADS: 5
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      # The provider's issuer URL — everything else is derived from it, the
      # discovery document at ${OIDC_ISSUER}/.well-known/openid-configuration
      # included. Set it to exactly the issuer the provider puts in the id_token
      # (its own discovery document's "issuer"), trailing slash and path and
      # all: it's what the iss claim is verified against.
      OIDC_ISSUER: ${OIDC_ISSUER}
      OIDC_PROVIDER_NAME: ${OIDC_PROVIDER_NAME}
      OIDC_REQUIRE_PKCE: ${OIDC_REQUIRE_PKCE}
      SPLAT_ALLOWED_USERS: ${SPLAT_ALLOWED_USERS}
    volumes:
      - ./storage:/rails/storage
      - ./storage/logs/web:/rails/log
    ports:
      - "${HOST_IP}:3030:3000"
    depends_on:
      - tuber
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

  # Drains tuber: ingestion (events, transactions, logs, forward, activejob,
  # check-ins) and the background jobs on splat.maintenance (retention,
  # rollups, storage stats, dictionary training). `all` boots Rails once and
  # forks a process per role, so a heavy maintenance job can't freeze
  # ingestion (SQLite holds Ruby's lock for the length of a query), while the
  # two share the memory Rails loaded. If the limit is hit, the kernel kills
  # the maintenance process first, and it's restarted.
  #
  # Prefer a memory limit per role? Run two services instead, with
  # `command: bin/worker ingest` and `command: bin/worker maintenance`.
  worker:
    <<: *splat-worker
    command: bin/worker all
    volumes:
      - ./storage:/rails/storage
      - ./storage/logs/worker:/rails/log
    mem_limit: 1G
    # Room for the processes to finish their batches after TERM; the worker
    # kills any still going after 25s.
    stop_grace_period: 30s

  # Only for a tuber older than 0.16, which can't fire config/schedule.yml
  # itself: this process fires it instead. On 0.16+ tuber does, and this would
  # only check that and sit idle, so it's off unless asked for:
  #
  #   docker compose -p splat --profile old-tuber up -d
  #
  # Settings → Scheduled jobs (and /_health) say if nothing is firing them.
  scheduler:
    <<: *splat-worker
    profiles: [old-tuber]
    command: bin/scheduler
    volumes:
      - ./storage:/rails/storage
      - ./storage/logs/scheduler:/rails/log
    mem_limit: 128M

  tuber:
    image: ghcr.io/tuberq/tuber:latest
    # The image's entrypoint is the bare `tuber` binary — without a subcommand
    # it prints help and exits. Env vars only populate flag values.
    command: server
    ports:
      - "${HOST_IP}:11330:11300"           # beanstalkd protocol (point tuber-tui here)
      - "${HOST_IP}:9130:9100"             # metrics — Prometheus / Uptime Kuma reachable here
    volumes:
      - ./storage/tuber:/var/lib/tuber/binlog
    restart: unless-stopped
    mem_limit: 1500M
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    environment:
      - TUBER_NAME=splat
      - TUBER_LISTEN=0.0.0.0
      - TUBER_PORT=11300
      - TUBER_BINLOG_DIR=/var/lib/tuber/binlog
      - TUBER_MAX_STORAGE_BYTES=10gb
      - TUBER_MAX_JOBS_SIZE=1gb
      - TUBER_MAX_JOB_SIZE=10mb         # per-job cap: one event/transaction/log, or a base64-forwarded envelope (~1.33x raw). Single items are sub-MB; 10mb is headroom. Tuber's own default is only 64KB.
      - TUBER_METRICS_PORT=9100
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
